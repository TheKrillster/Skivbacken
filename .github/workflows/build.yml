name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the zip uploaded most recently, whatever the phone named it
      # (Skivbacken.zip, Skivbacken (1).zip, ...).
      - name: Packa upp projektet
        run: |
          latest="$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 . || true)"
          if [ -n "$latest" ]; then
            echo "Bygger från: $latest"
            rm -rf Skivbacken
            unzip -o -q "$latest"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bygg appen
        run: |
          if [ -d Skivbacken ]; then cd Skivbacken; fi
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; then
            # Show the compiler's errors as annotations on the run, so they can be read without logging in.
            grep -E "^e: " "$GITHUB_WORKSPACE/build.log" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cp "$(find . -name app-debug.apk | head -1)" "$GITHUB_WORKSPACE/Skivbacken.apk"

      - name: Lägg ut APK-filen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skivbacken ${{ github.run_number }}
          files: Skivbacken.apk
          make_latest: true
